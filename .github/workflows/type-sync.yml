name: Automated Type Sync

on:
  schedule:
    # Runs at 02:00 UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync-types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update Types
        run: pnpm types:update

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update OpenAPI spec and generated types'
          title: '🔄 Auto-sync: API Types Update'
          body: |
            ## 🤖 Automated Type Sync
            
            This PR was automatically generated by the daily Automated Type Sync workflow.
            It downloads the latest OpenAPI spec from Port.io and regenerates the TypeScript types.
            
            ### Changes
            - Updated `src/types/api.ts` based on the latest Port.io OpenAPI specification.
            
            ### Verification Recommendation
            - Review the changes in `src/types/api.ts` to identify new features or breaking changes.
            - Ensure any new properties are appropriately handled in the SDK resources.
          branch: auto-sync/types-update
          delete-branch: true
          labels: |
            automated
            openapi-sync
            types
